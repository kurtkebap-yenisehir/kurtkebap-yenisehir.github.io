    :root {

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { width: 43px; height: 43px; }
    .brand-name { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; line-height: 1.5; }

    .welcome { position: relative; padding-block: 27px 26px; }

    h1 em { font-weight: 400; }
    .links { display: grid; gap: 12px; }
    .menu-link { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; min-height: 146px; padding: 24px; background: var(--green); color: var(--cream); border: 1px solid var(--green); overflow: hidden; }

    .menu-link:hover { background: #314d3c; }
    .menu-copy { position: relative; z-index: 1; min-width: 0; }
    .menu-eyebrow { display: block; margin-bottom: 18px; color: #e0b58c; font-size: 9px; font-weight: 700; letter-spacing: 2.1px; }
    .menu-title { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 400; letter-spacing: -.6px; line-height: 1.15; }

    .skewers { position: absolute; top: 16px; right: 25px; width: 75px; height: 82px; color: var(--copper); opacity: .72; pointer-events: none; }
    .order-section { margin-block: 25px; }
    .order-disclosure { min-width: 0; }

    .order-chevron { width: 20px; height: 20px; }
    .order-disclosure[open] > .order-summary .order-chevron { transform: rotate(180deg); }
    .order-disclosure:not([open]) > .order-platforms { display: none; }
    .order-platforms { display: grid; padding-top: 6px; }
    .order-platform { display: flex; align-items: center; gap: 12px; min-height: 57px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
    .order-platform:hover { background: #eeeee3; }
    .order-platform > svg { width: 17px; height: 17px; margin-left: auto; }

    .social-link { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 14px 20px; border: 1px solid var(--line); background: #fbf9f3; }

    .social-icon { display: grid; place-items: center; width: 38px; height: 38px; flex-shrink: 0; }
    .social-copy { min-width: 0; flex: 1; }
    .social-title { display: block; font-size: 15px; font-weight: 600; line-height: 1.4; }
    .social-arrow { width: 18px; height: 18px; }

    @media (min-width: 600px) {

    @media (max-width: 350px) {

      .menu-arrow { border-color: LinkText; }
    }

</head>
